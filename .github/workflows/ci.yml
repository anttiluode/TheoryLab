name: TheoryLab CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate machine contracts
        run: python -m theorylab validate
      - name: Check browser JavaScript
        run: node --check assets/app.js
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Execute seed theory
        run: python -m theorylab run theories/noncommuting_write.json --json
      - name: Generate grounded proposal
        run: python -m theorylab propose "Can useful computational coordinates and persistent write self-align through experience?" --json
      - name: Run promoted basis-alignment theory
        run: python -m theorylab run theories/learned_basis_alignment.json --json
      - name: Generate coordinate-tracking proposal
        run: python -m theorylab propose "Can a local online learner preserve useful computational identity when the resident coordinate system itself drifts?" --json
      - name: Run online coordinate-tracking theory
        run: python -m theorylab run theories/online_coordinate_tracking.json --json
